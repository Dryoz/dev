    AnalyseDesignerFramework.registerComponent('PreviewPanel', {
      template: `
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">📊 Datenvorschau</div>
              <div class="panel-subtitle">Rechtsklick auf Spalte für Metriken</div>
            </div>
          </div>
          <div class="panel-body">
            <div data-ref="dataTableWrapper">
              <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <p>Wähle Felder aus dem Datenmodell aus, um die Vorschau zu sehen</p>
              </div>
            </div>
          </div>
        </div>
      `,
      
      mounted() {
        this.updatePreview();
        
        AnalyseDesignerFramework.subscribe('stateChange:selectedFields', () => this.updatePreview());
        AnalyseDesignerFramework.subscribe('stateChange:tableJoins', () => this.updatePreview());
        AnalyseDesignerFramework.subscribe('stateChange:columnAggregations', () => this.updatePreview());
        // Filter-Panel bei jeder Änderung neu aufbauen (Dropdowns/Inputs sind dann nie leer)
        AnalyseDesignerFramework.subscribe('stateChange:filters', () => { try { this.renderFilters?.(); } catch(e) {} });

      },
      
      updatePreview() {
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        const mockData = AnalyseDesignerFramework.getState('mockData');
        const tableJoins = AnalyseDesignerFramework.getState('tableJoins');
        const columnAggregations = AnalyseDesignerFramework.getState('columnAggregations');
        
        if (selectedFields.length === 0) {
          this.refs.dataTableWrapper.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <p>Wähle Felder aus dem Datenmodell aus, um die Vorschau zu sehen</p>
            </div>
          `;
          return;
        }
        
        const tables = [...new Set(selectedFields.map(f => f.table))];
        let dataset = [];
        
        if (tables.length === 1) {
          dataset = mockData[tables[0]].map(row => {
            const newRow = {};
            selectedFields.forEach(f => {
              newRow[`${f.table}.${f.field}`] = row[f.field];
            });
            return newRow;
          });
        } else {
          const baseTable = tables.includes('Account') ? 'Account' : tables[0];
          dataset = mockData[baseTable].map(baseRow => {
            const row = {};
            selectedFields.filter(f => f.table === baseTable).forEach(f => {
              row[`${f.table}.${f.field}`] = baseRow[f.field];
            });
            tables.filter(t => t !== baseTable).forEach(table => {
              const joinKey = tableJoins.find(j => j.toTable === table)?.via || 'Account_ID';
              const relatedRows = mockData[table].filter(r => r[joinKey] === baseRow[joinKey]);
              if (relatedRows.length > 0) {
                const relatedRow = relatedRows[0];
                selectedFields.filter(f => f.table === table).forEach(f => {
                  row[`${f.table}.${f.field}`] = relatedRow[f.field];
                });
              }
            });
            return row;
          });
        }
        
        const columns = selectedFields.map(f => {
          const full = `${f.table}.${f.field}`;
          return {
            title: full,
            data: null,
            render: (data, type, row) => {
              const value = row ? row[full] : data;
              if (type === 'display' && value !== null && value !== undefined) {
                if (f.type === 'number') return new Intl.NumberFormat('de-CH').format(value);
                if (f.type === 'date') return new Date(value).toLocaleDateString('de-CH');
              }
              return value ?? '';
            }
          };
        });
        
        const dataTable = AnalyseDesignerFramework.getState('dataTable');
        if (dataTable) dataTable.destroy();
        
        this.refs.dataTableWrapper.innerHTML = '<table id="dataTable" class="display" style="width:100%"></table>';
        
        const hasAggregations = Object.keys(columnAggregations).length > 0;
        const metricsForCallback = AnalyseDesignerFramework.getState('metrics') || [];
        const hasMetrics = metricsForCallback.length > 0;

        // KRITISCH: Footer MUSS vor DataTable-Init erstellt werden
        if (hasAggregations || hasMetrics) {
          const table = this.refs.dataTableWrapper.querySelector('#dataTable');
          const tfoot = document.createElement('tfoot');
          const tr = document.createElement('tr');
          columns.forEach(() => {
            const th = document.createElement('th');
            th.textContent = ''; // Placeholder
            tr.appendChild(th);
          });
          tfoot.appendChild(tr);
          table.appendChild(tfoot);
        }
        
        const footerCallback = (hasAggregations || hasMetrics) ? function(row, data, start, end, display) {

          const api = this.api();
          
          selectedFields.forEach((field, colIndex) => {
            const fullName = `${field.table}.${field.field}`;
            const aggs = columnAggregations[fullName];
            
            if (aggs && field.type === 'number') {
              const column = api.column(colIndex);
              const values = column.data().toArray().map(row => parseFloat(row[fullName]) || 0);
              
              let footerText = '';
              if (aggs.sum)   footerText += `Σ ${values.reduce((a, b) => a + b, 0).toLocaleString('de-CH')} `;
              if (aggs.avg)   footerText += `Ø ${(values.reduce((a, b) => a + b, 0) / Math.max(values.length, 1)).toFixed(0).toLocaleString('de-CH')} `;
              if (aggs.min)   footerText += `Min ${Math.min(...values).toLocaleString('de-CH')} `;
              if (aggs.max)   footerText += `Max ${Math.max(...values).toLocaleString('de-CH')} `;
              if (aggs.count) footerText += `# ${values.length} `;
              
              const footer = api.column(colIndex).footer();
              if (footer) footer.innerHTML = footerText.trim();
            }
          });
        } : undefined;
        
        const newDataTable = new DataTable('#dataTable', {
          data: dataset,
          columns: columns,
          pageLength: 10,
          footerCallback: (hasAggregations || hasMetrics) ? footerCallback : undefined,
          language: {
            search: 'Suchen:',
            lengthMenu: '_MENU_ Einträge pro Seite',
            info: '_START_ bis _END_ von _TOTAL_ Einträgen',
            infoEmpty: '0 Einträge',
            infoFiltered: '(gefiltert von _MAX_ Einträgen)',
            paginate: { first: 'Erste', last: 'Letzte', next: 'Nächste', previous: 'Vorherige' }
          }
        });
        
        // Footer nach jedem Redraw erneut berechnen (unabhängig von Metriken/Spalten-Aggregationen)
        try { $('#dataTable').on('draw.dt', () => { try { this.reapplyColumnAggregations(); } catch(e) {} }); } catch(e) {}

        AnalyseDesignerFramework.setState('dataTable', newDataTable);
        this.setupDragAndDrop();
        this.setupCellDrag();
      },
      
      renderMetricSparklines(data) {
        try {
          const metrics = AnalyseDesignerFramework.getState('metrics') || [];
          if (!metrics.length) return;
          const xAxis = AnalyseDesignerFramework.getState('xAxis'); // optional

          // Hilfsfunktion: Punkte -> SVG Pfad
          const toPath = (arr, w=120, h=28, pad=4) => {
            if (!arr.length) return '';
            const min = Math.min(...arr), max = Math.max(...arr);
            const span = (max - min) || 1;
            const dx = (w - pad*2) / Math.max(arr.length-1,1);
            const mapY = v => h - pad - ((v - min) / span) * (h - pad*2);
            let d = '';
            arr.forEach((v,i) => {
              const x = pad + i*dx, y = mapY(v);
              d += (i ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
            });
            return { d, w, h };
          };

          // Datenreihen je Metrik aggregieren
          const makeSeries = (metric) => {
            const key = `${metric.table}.${metric.field}`;
            if (xAxis && xAxis.table && xAxis.field) {
              const xKey = `${xAxis.table}.${xAxis.field}`;
              const buckets = new Map();
              data.forEach(r => {
                const x = r[xKey];
                const y = parseFloat(String(r[key]).replace(/[^0-9\.\-]/g,'')) || 0;
                if (!buckets.has(x)) buckets.set(x, []);
                buckets.get(x).push(y);
              });
              const ordered = Array.from(buckets.keys());
              const vals = ordered.map(k => {
                const arr = buckets.get(k) || [];
                switch (metric.aggregation) {
                  case 'sum': return arr.reduce((a,b)=>a+b,0);
                  case 'min': return Math.min(...arr);
                  case 'max': return Math.max(...arr);
                  case 'count': return arr.length;
                  default: return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
                }
              });
              return vals;
            } else {
              // einfache Folge
              const vals = data.map(r => parseFloat(String(r[key]).replace(/[^0-9\.\-]/g,'')) || 0);
              return vals.slice(-20); // letzte 20 Werte
            }
          };

          // in vorhandene Metrik-Karten einfügen (Container mit data-metric-index)
          const cards = document.querySelectorAll('[data-metric-index]');
          cards.forEach(card => {
            const idx = parseInt(card.getAttribute('data-metric-index'), 10);
            const m = metrics[idx];
            if (!m) return;
            const series = makeSeries(m);
            const svgBox = card.querySelector('.metric-sparkline');
            if (!svgBox) return;
            const { d, w, h } = toPath(series);
            svgBox.innerHTML = d ? `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2"/></svg>` : '';
          });
        } catch(e) {
          console.warn('renderMetricSparklines failed:', e);
        }
      },

        const view = header.dataset.view || '';

      updateColumnAggregation(header, type) {
        try {
          const table = document.querySelector('#dataTable');
          if (!table) return;

          // 1) Keine Labels im THEAD: evtl. alte Header-Badges entfernen
          header.querySelectorAll('.col-agg-head').forEach(n => n.remove());

          const colIdx = Array.from(header.parentNode.children).indexOf(header);
          const bodyRows = table.tBodies[0]?.rows || [];

          // 2) Werte einsammeln
          const values = [];
          for (let i = 0; i < bodyRows.length; i++) {
            const cell = bodyRows[i].cells[colIdx];
            const raw  = (cell?.textContent || '').replace(/[^0-9\.\-]/g, '');
            const num  = parseFloat(raw);
            if (!isNaN(num)) values.push(num);
          }

          // 3) Footer-Zeile sicherstellen (genau 1 Zeile)
          let tfoot = table.tFoot;
          if (!tfoot) tfoot = table.createTFoot();
          let row = tfoot.rows[0];
          if (!row) row = tfoot.insertRow(0);
          // auf Spaltenanzahl bringen
          while (row.cells.length < header.parentNode.children.length) row.insertCell();
          while (row.cells.length > header.parentNode.children.length) row.deleteCell(-1);

          // 4) Ergebnis berechnen oder leeren
          let result = null;
          switch (type) {
            case 'sum':   result = values.reduce((a,b)=>a+b,0); break;
            case 'avg':   result = values.length ? values.reduce((a,b)=>a+b,0)/values.length : null; break;
            case 'min':   result = values.length ? Math.min(...values) : null; break;
            case 'max':   result = values.length ? Math.max(...values) : null; break;
            case 'count': result = values.length; break;
            default:      result = null;
          }

          // 5) Genau die Zelle dieser Spalte aktualisieren, alle anderen unberührt
          const c = row.cells[colIdx];
          if (result === null) {
            c.textContent = '';
          } else {
            // hübsch formatiert, CH-Format
            try { c.textContent = result.toLocaleString('de-CH'); }
            catch { c.textContent = String(result); }
          }
          c.style.fontWeight = '600';
          c.style.textAlign  = 'right';
          c.style.background = '#f9fafb';

        } catch(e) {
          console.warn('Aggregation-Fehler:', e);
        }
      },      

      reapplyColumnAggregations() {
        try {
          const table = document.querySelector('#dataTable');
          const thead = table?.tHead;
          if (!thead) return;
          const headers = Array.from(thead.rows[0].cells);
          headers.forEach(h => {
            const agg = h.dataset?.aggregation || '';
            // '' = keine Aggregation → Footer-Zelle leeren, sonst berechnen
            this.updateColumnAggregation(h, agg || null);
          });
        } catch (e) {
          console.warn('reapplyColumnAggregations failed:', e);
        }
      },

      removeTable(tableName) {
        try {
          const fields = AnalyseDesignerFramework.getState('selectedFields') || [];
          const next = fields.filter(f => f.table !== tableName);
          AnalyseDesignerFramework.setState('selectedFields', next);
          AnalyseDesignerFramework.showNotification(`Tabelle „${tableName}” entfernt.`, 'success');
          this.refreshPreview();
        } catch (err) {
          AnalyseDesignerFramework.showNotification('Fehler beim Entfernen der Tabelle: ' + (err?.message || err), 'error');
        }
      },
      
      removeColumn(field) {
        try {
          const fields = AnalyseDesignerFramework.getState('selectedFields') || [];
          const next = fields.filter(f => !(f.table === field.table && f.field === field.field));
          AnalyseDesignerFramework.setState('selectedFields', next);
          AnalyseDesignerFramework.showNotification(`Spalte „${field.table}.${field.field}” entfernt.`, 'success');
          this.refreshPreview();
        } catch (err) {
          AnalyseDesignerFramework.showNotification('Fehler beim Entfernen der Spalte: ' + (err?.message || err), 'error');
        }
      },

      addQuickFilter(tableName, fieldName, value) {
        try {
          const filters = AnalyseDesignerFramework.getState('filters') || [];
          const fieldKey = `${tableName}.${fieldName}`;
          const existing = filters.find(f => f.fieldKey === fieldKey);
          if (existing) {
            existing.conditions.push({ id: Date.now(), operator: '=', value: value });
          } else {
            filters.push({
              id: Date.now(),
              fieldKey: fieldKey,
              table: tableName,
              field: fieldName,
              type: 'text',
              localLogic: 'OR',
              conditions: [{ id: Date.now(), operator: '=', value: value }]
            });
          }
          AnalyseDesignerFramework.setState('filters', filters);
          this.renderFilters();
          AnalyseDesignerFramework.showNotification(`Filter gesetzt: ${tableName}.${fieldName} = "${value}"`, 'success');
          this.refreshPreview();
        } catch (err) {
          AnalyseDesignerFramework.showNotification('Filter konnte nicht gesetzt werden: ' + (err?.message || err), 'error');
        }
      },
      
      refreshPreview() {
        // Versuche gängige Render-Methoden dieser Seite aufzurufen
        try {
          if (typeof this.renderPreview === 'function') return this.renderPreview();
          if (typeof this.renderDataPreview === 'function') return this.renderDataPreview();
          if (typeof this.buildPreview === 'function') return this.buildPreview();
          // Fallback: DataTable neu aufbauen durch künstliches Re-Init
          const evt = new CustomEvent('analyse:preview:refresh');
          document.dispatchEvent(evt);
        } catch (e) {
          // letzte Reserve: Hinweis an User
          AnalyseDesignerFramework.showNotification('Vorschau konnte nicht automatisch aktualisiert werden. Bitte Ansicht neu laden.', 'warning');
        }
      },

      setupDragAndDrop() {



        setTimeout(() => {
          const headers = document.querySelectorAll('#dataTable thead th');
          const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
          
          headers.forEach((header, idx) => {
            header.draggable = true;
            // Exakten Spalten-Schlüssel als Attribut hinterlegen (ordnungsgleich zu selectedFields)
            if (selectedFields[idx]) {
              header.dataset.col = `${selectedFields[idx].table}.${selectedFields[idx].field}`;
            }
            // Default-Interaktion pro Spalte (No-Code via data-* veränderbar)
            if (!header.dataset.behavior) header.dataset.behavior = 'none';   // none|datalink|subview
            if (!header.dataset.view)     header.dataset.view     = 'right';  // left|right|full
            if (!header.dataset.linkTemplate) header.dataset.linkTemplate = ''; // z. B. /app/account/{Account.Id}
            // Indikator direkt aktualisieren
            this.updateHeaderBehaviorIndicator(header);

            // ➜ Sichtbares Badge + Tooltip
            this.updateHeaderBehaviorIndicator(header);
            
            // Header sichtbar/positionierbar machen (für Hint & Badge)
            header.style.position = 'relative';
            header.style.overflow = 'visible';
            header.style.paddingRight = '2.8rem';

            const hint = document.createElement('span');
            hint.className = 'drag-hint';
            hint.textContent = '⋮⋮';
            hint.style.position = 'absolute';
            hint.style.top = '0.5rem';
            hint.style.right = '0.6rem';
            hint.style.lineHeight = '1';
            hint.style.userSelect = 'none';
            hint.style.pointerEvents = 'none';
            header.appendChild(hint);

            
            header.addEventListener('dragstart', (e) => {
              const columnKey = header.dataset.col;
              const field = columnKey ? selectedFields.find(f => `${f.table}.${f.field}` === columnKey) : null;
              if (!field) {
                AnalyseDesignerFramework.showNotification('⚠️ Ungültiges Drag-&-Drop-Objekt.', 'warning');
                return;
              }
              e.dataTransfer.setData('application/json', JSON.stringify(field));
              e.dataTransfer.effectAllowed = 'copy';
              header.classList.add('dragging');
            });
            
            header.addEventListener('dragend', () => {
              header.classList.remove('dragging');
            });
            
            header.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              const columnKey = header.dataset.col;
              const field = columnKey ? selectedFields.find(f => `${f.table}.${f.field}` === columnKey) : null;
              if (field) {
                // Hinweis: showContextMenu darf header.dataset.* ändern
                this.showContextMenu(e.pageX, e.pageY, field, header);
                // Nach möglicher Änderung UI aktualisieren
                setTimeout(() => this.updateHeaderBehaviorIndicator(header), 0);
              }
            });
          });

          // Kontextmenü-Fallback: fange Rechtsklicks überall im thead ab (auch auf Icons)
          const thead = document.querySelector('#dataTable thead');
          if (thead) {
            thead.addEventListener('contextmenu', (ev) => {
              const header = ev.target.closest('th');
              if (!header) return;
              ev.preventDefault();
              const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
              const columnKey = header.dataset.col;
              const field = columnKey ? selectedFields.find(f => `${f.table}.${f.field}` === columnKey) : null;
              if (field) {
                this.showContextMenu(ev.pageX, ev.pageY, field, header);
                setTimeout(() => this.updateHeaderBehaviorIndicator(header), 0);
              }
            });
          }

          // Row-Klicks am tbody – verhalten pro Spalte über data-behavior|data-view|data-link-template
          const tbody = document.querySelector('#dataTable tbody');
          if (tbody) {
            // Zellwert → Schnellfilter per Doppelklick (gleich =) — EINMAL registrieren, nicht pro Klick
            tbody.addEventListener('dblclick', (e) => {
              const cell = e.target.closest('td');
              if (!cell) return;
              const headers = document.querySelectorAll('#dataTable thead th');
              const colIndex = cell.cellIndex;
              const header = headers[colIndex];
              if (!header || !header.dataset || !header.dataset.col) return;
              const [tableName, fieldName] = header.dataset.col.split('.');
              const rawValue = cell.textContent.trim();
              if (!tableName || !fieldName || rawValue === '') return;
              this.addQuickFilter(tableName, fieldName, rawValue);
            });

            tbody.addEventListener('click', (e) => {
              const cell = e.target.closest('td');
              if (!cell) return;
              const rowEl = cell.parentElement;
              const colIndex = cell.cellIndex;
              const header = headers[colIndex];
              if (!header) return;

              const behavior = header.dataset.behavior || 'none';
              if (behavior === 'none') return;

              // Row-Objekt: Key = header.dataset.col (table.field)
              const rowObj = {};
              [...rowEl.children].forEach((td, i) => {
                const key = headers[i]?.dataset?.col;
                if (key) rowObj[key] = td.textContent.trim();
              });

              if (behavior === 'datalink') {
                const tpl = header.dataset.linkTemplate || '';
                const url = tpl.replace(/\{([^}]+)\}/g, (_, k) => (rowObj[k] ?? ''));
                AnalyseDesignerFramework.emit('analyse:datalink', {
                  url,
                  column: header.dataset.col,
                  view: header.dataset.view || 'right',
                  row: rowObj
                });
              } else if (behavior === 'subview') {
                AnalyseDesignerFramework.emit('analyse:subview', {
                  variant: header.dataset.view || 'right', // left|right|full
                  column: header.dataset.col,
                  row: rowObj
                });
              }
            });
          }
        // Standard-Achsen vorbelegen, wenn leer
        (() => {
          const hasX = !!AnalyseDesignerFramework.getState('xAxis');
          const hasY = !!AnalyseDesignerFramework.getState('yAxis');
          if (hasX && hasY) return;

          const sf = AnalyseDesignerFramework.getState('selectedFields') || [];
          const byKey = (t,f) => sf.find(x => x.table===t && x.field===f);

          // Priorität 1: gewünschte Defaults
          let x = AnalyseDesignerFramework.getState('xAxis') || byKey('Account','Region');
          let y = AnalyseDesignerFramework.getState('yAxis') || byKey('Opportunity','Amount');

          // Fallbacks: erste Text-Spalte als X, erste Number/Amount/Revenue als Y
          if (!x) {
            x = sf.find(f => (f.type === 'text')) || sf[0] || null;
          }
          if (!y) {
            y = sf.find(f => f.type === 'number')
              || sf.find(f => /amount|revenue|value|score|id/i.test(f.field))
              || null;
          }

          if (x) AnalyseDesignerFramework.setState('xAxis', x);
          if (y) AnalyseDesignerFramework.setState('yAxis', y);
        })();

        // Chips für X/Y anhand des aktuellen States zeichnen
        this.refreshAxisChips();

        }, 500);
      },

      
      setupCellDrag() {
        // macht Tabellenzellen draggable und erlaubt Drop in die Filter-Zone
        setTimeout(() => {
          const table = document.querySelector('#dataTable');
          if (!table) return;

          const thead = table.tHead;
          const tbody = table.tBodies[0];
          if (!thead || !tbody) return;

          const headers = Array.from(thead.rows[0].cells);

          // 1) Zellen draggable machen
          tbody.querySelectorAll('td').forEach(td => {
            td.setAttribute('draggable', 'true');

            td.addEventListener('dragstart', (e) => {
              const colIndex = td.cellIndex;
              const header   = headers[colIndex];
              const key      = header?.dataset?.col || '';     // "Table.Field"
              const value    = (td.textContent || '').trim();

              // Falls nichts Brauchbares – abbrechen
              if (!key || value === '') return;

              // Kompaktes Payload für Filter-Drop
              const [tableName, fieldName] = key.split('.');
              const payload = {
                table: tableName,
                field: fieldName,
                value: value,
                isCellDrag: true
              };


              e.dataTransfer.setData('application/json', JSON.stringify(payload));
              e.dataTransfer.effectAllowed = 'copy';
            });
          });

          // 2) Drop-Zone (Filter) finden
          const filterZone = document.querySelector('[data-ref="filtersDropZone"]');
          if (!filterZone) return;

          // optische Reaktion
          ['dragenter', 'dragover'].forEach(ev =>
            filterZone.addEventListener(ev, (e) => {
              e.preventDefault();
              filterZone.classList.add('drag-over');
            })
          );
          ['dragleave', 'drop'].forEach(ev =>
            filterZone.addEventListener(ev, () => filterZone.classList.remove('drag-over'))
          );

          // eigentlicher Drop → QuickFilter setzen
          filterZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const raw = e.dataTransfer.getData('application/json');
            if (!raw || raw === 'undefined') return;

            let data;
            try { data = JSON.parse(raw); } catch { return; }
            if (!data || !data.table || !data.field) return;

            // Filter an State anhängen (Operator "=" als Default)
            try {
              const filters = AnalyseDesignerFramework.getState('filters') || [];
              const fieldKey = `${data.table}.${data.field}`;
              const existing = filters.find(f => f.fieldKey === fieldKey);
              if (existing) {
                existing.conditions.push({ id: Date.now(), operator: '=', value: data.value });
              } else {
                filters.push({
                  id: Date.now(),
                  fieldKey: fieldKey,
                  table: data.table,
                  field: data.field,
                  type: 'text',
                  localLogic: 'OR',
                  conditions: [{ id: Date.now(), operator: '=', value: data.value }]
                });
              }
              AnalyseDesignerFramework.setState('filters', filters);
              this.renderFilters();
              AnalyseDesignerFramework.showNotification(`Filter gesetzt: ${data.table}.${data.field} = "${data.value}"`, 'success');
            } catch (err) {
              AnalyseDesignerFramework.showNotification('Filter konnte nicht gesetzt werden: ' + (err?.message || err), 'error');
            }
          });
        }, 300);
      },

        AnalyseDesignerFramework.setState('metrics', metrics);

      handleFilterDrop(field) {
        const filters = AnalyseDesignerFramework.getState('filters');

          AnalyseDesignerFramework.showNotification('⚠️ Dieses Element kann nicht als Filter verwendet werden.', 'warning');
          return;
        }
        
        const operator = field.isCellDrag ? (field.type === 'text' ? '=' : '=') : '=';
        const value = field.isCellDrag ? (field.value ?? '') : '';
        
        const fieldKey = `${field.table}.${field.field}`;
        
        const existingGroup = filters.find(f => f.fieldKey === fieldKey);
        
        if (existingGroup) {
          existingGroup.conditions.push({
            id: Date.now(),
            operator: operator,
            value: value
          });
        } else {

            id: Date.now(),
            fieldKey: fieldKey,
            table: field.table,

            type: field.type,
            localLogic: 'OR',
            conditions: [{

              ${condIndex < filterGroup.conditions.length - 1 ? `
                <div style="display: flex; gap: 0.25rem; margin: 0.5rem 0; padding-left: 1rem;">
                  <button class="local-logic-toggle" data-group-index="${groupIndex}" data-logic="AND" style="padding: 0.25rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: ${filterGroup.localLogic === 'AND' ? 'var(--primary)' : 'var(--surface)'}; color: ${filterGroup.localLogic === 'AND' ? 'white' : 'var(--text)'}; cursor: pointer; font-size: 0.75rem; font-weight: 600;">UND</button>
                  <button class="local-logic-toggle" data-group-index="${groupIndex}" data-logic="OR" style="padding: 0.25rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: ${filterGroup.localLogic === 'OR' ? 'var(--primary)' : 'var(--surface)'}; color: ${filterGroup.localLogic === 'OR' ? 'white' : 'var(--text)'}; cursor: pointer; font-size: 0.75rem; font-weight: 600;">ODER</button>
                </div>
              ` : ''}
            `).join('')}
          </div>
        `).join('');
        
        this.refs.filterDropZone.innerHTML = html;
        
        // Bind all filter events
        this.bindFilterEvents();
      },
      
      bindFilterEvents() {
        const filterDropZone = this.refs.filterDropZone;
        if (!filterDropZone) return;
        
        filterDropZone.querySelectorAll('.filter-remove-group').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const groupIndex = parseInt(e.target.dataset.groupIndex);
            const filters = AnalyseDesignerFramework.getState('filters');
            filters.splice(groupIndex, 1);
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters();
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('.filter-add-condition').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const groupIndex = parseInt(e.target.dataset.groupIndex);
            const filters = AnalyseDesignerFramework.getState('filters');
            filters[groupIndex].conditions.push({
              id: Date.now(),
              operator: '=',
              value: ''
            });
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters();
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('.filter-remove-condition').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const groupIndex = parseInt(e.target.dataset.groupIndex);
            const condIndex = parseInt(e.target.dataset.condIndex);
            const filters = AnalyseDesignerFramework.getState('filters');
            filters[groupIndex].conditions.splice(condIndex, 1);
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters();
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('select[data-type="operator"]').forEach(select => {
          select.addEventListener('change', (e) => {
            const groupIndex = parseInt(e.target.dataset.groupIndex);
            const condIndex = parseInt(e.target.dataset.condIndex);
            const filters = AnalyseDesignerFramework.getState('filters');
            filters[groupIndex].conditions[condIndex].operator = e.target.value;
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters();
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('input[data-group-index]').forEach(input => {
          input.addEventListener('change', (e) => {
            const groupIndex = parseInt(e.target.dataset.groupIndex);
            const condIndex = parseInt(e.target.dataset.condIndex);
            const filters = AnalyseDesignerFramework.getState('filters');
            filters[groupIndex].conditions[condIndex].value = e.target.value;
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters();
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('.local-logic-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const groupIndex = parseInt(btn.dataset.groupIndex);
            const logic = btn.dataset.logic;
            const filters = AnalyseDesignerFramework.getState('filters');
            filters[groupIndex].localLogic = logic;
            AnalyseDesignerFramework.setState('filters', filters);
            this.renderFilters(); // Re-render nach State-Änderung
          });
        });
        
        this.refs.filterDropZone.querySelectorAll('.filter-logic-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            const newLogic = btn.getAttribute('data-logic');
            AnalyseDesignerFramework.setState('filterLogic', newLogic);
            this.renderFilters(); // Re-render nach State-Änderung
          });
        });
      },

      async runAnalysis() {
        // Dateimodus: Hinweis zeigen, aber NICHT abbrechen → unten greift der Demo-Fallback
        if (location.protocol === 'file:') {
          AnalyseDesignerFramework.showNotification(
            'Datei-Modus (file://): Serveraufrufe blockiert – Demo-Daten werden lokal analysiert.',
            'info'
          );
        }


        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        
        if (selectedFields.length === 0) {
          AnalyseDesignerFramework.showNotification('⚠️ Bitte wähle mindestens ein Feld aus!', 'warning');
          return;
        }
        
        const mainTable = AnalyseDesignerFramework.getState('mainTable');
        const tableJoins = AnalyseDesignerFramework.getState('tableJoins');
        const filters = AnalyseDesignerFramework.getState('filters');
        const joinFieldByTable = AnalyseDesignerFramework.getState('joinFieldByTable');
        const xAxis = AnalyseDesignerFramework.getState('xAxis');
        const yAxis = AnalyseDesignerFramework.getState('yAxis');

        // Datei-Modus: lokaler Fallback auf Demo-Daten (kein CORS-Fehler)
        if (location.protocol === 'file:') {
          try {
            const rows = [];
            const oppByAcc = new Map();
            (mockData?.Opportunity || []).forEach(o => {
              const arr = oppByAcc.get(o.Account_ID) || [];
              arr.push(o);
              oppByAcc.set(o.Account_ID, arr);
            });
            (mockData?.Account || []).forEach(a => {
              const opps = oppByAcc.get(a.Account_ID) || (selectedFields.some(f => f.table === 'Opportunity') ? [] : [{}]);
              opps.forEach(o => {
                const rec = {};
                selectedFields.forEach(f => {
                  if (f.table === 'Account') rec[`${f.table}.${f.field}`] = a[f.field] ?? '';
                  else if (f.table === 'Opportunity') rec[`${f.table}.${f.field}`] = o[f.field] ?? '';
                });
                rows.push(rec);
              });
            });
            // flexible Filter (unterstützt Gruppen/Conditions & Legacy-Format)
            let filteredData = rows;
            const filterLogic = (AnalyseDesignerFramework.getState('filterLogic') || 'AND').toUpperCase();

            const evalCond = (row, cond, key) => {
              const v = String(row[key] ?? '');
              const t = String(cond.value ?? '');
              if (cond.operator === 'contains') return v.toLowerCase().includes(t.toLowerCase());
              return v === t; // '=' default
            };

            if (Array.isArray(filters) && filters.length && filters[0]?.conditions) {
              // neues Gruppenformat
              filteredData = rows.filter(row => {
                const groupResults = filters.map(g => {
                  const key = `${g.table}.${g.field}`;
                  const localAnd = (g.localLogic || 'OR').toUpperCase() === 'AND';
                  return localAnd
                    ? g.conditions.every(c => evalCond(row, c, key))
                    : g.conditions.some(c => evalCond(row, c, key));
                });
                return filterLogic === 'AND'
                  ? groupResults.every(Boolean)
                  : groupResults.some(Boolean);
              });
            } else {
              // Legacy: flaches Format
              (filters || []).forEach(fl => {
                const key = `${fl.table}.${fl.field}`;
                if (fl.operator === '=') {
                  filteredData = filteredData.filter(r => String(r[key]) === String(fl.value));
                } else if (fl.operator === 'contains') {
                  filteredData = filteredData.filter(r => String(r[key]).toLowerCase().includes(String(fl.value).toLowerCase()));
                }
              });
            }

            AnalyseDesignerFramework.setState('lastAnalysisData', filteredData);
            this.renderKPIs(filteredData);
            this.renderMetricSparklines(filteredData);
            this.renderResultsTable(filteredData);
            if (xAxis && yAxis) this.renderChart(filteredData);
            const mainContainer = document.querySelector('.container');
            mainContainer.classList.add('results-mode');
            this.refs.resultsPanel.classList.add('active');
            return;
          } catch (e) {
            AnalyseDesignerFramework.showNotification('⚠️ Demo-Analyse lokal nicht möglich: ' + (e?.message || e), 'warning');
          }
        }
        
        // SERVER CALL: Führe Analyse auf dem Server aus
        try {
          AnalyseDesignerFramework.showNotification('⏳ Analyse wird ausgeführt.', 'info');
          if (location.protocol === 'file:') {
            AnalyseDesignerFramework.showNotification('Fehler bei der Analyse: Datei-Modus (file://) – CORS blockiert Serveraufrufe. Öffne die Seite via http(s) oder nutze Demo-Daten.', 'error');
            return;
          }
          
          const response = await fetch(API_ENDPOINTS.executeAnalysis, {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mainTable: mainTable,
              selectedFields: selectedFields,
              joins: tableJoins,
              joinFieldByTable: joinFieldByTable,
              filters: filters,
              filterLogic: AnalyseDesignerFramework.getState('filterLogic')
            })
          });
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          
          const result = await response.json();
          
          if (!result.success) {
            AnalyseDesignerFramework.showNotification('❌ Analyse fehlgeschlagen: ' + (result.error || 'Unbekannter Fehler'), 'error');
            return;
          }
          
          const filteredData = result.data;
          
          // Rest bleibt gleich - KPIs, Table, Chart rendern
          AnalyseDesignerFramework.setState('lastAnalysisData', filteredData);
          
          this.renderKPIs(filteredData);
          this.renderResultsTable(filteredData);
          if (xAxis && yAxis) this.renderChart(filteredData);
          
          const mainContainer = document.querySelector('.container');
          mainContainer.classList.add('results-mode');
          this.refs.resultsPanel.classList.add('active');
          
          AnalyseDesignerFramework.showNotification('✅ Analyse abgeschlossen!', 'success');
          
        } catch (error) {
          console.error('Analysis failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler bei der Analyse: ' + error.message, 'error');
        }
      },
      
      backToConfig() {
        const mainContainer = document.querySelector('.container');
        mainContainer.classList.remove('results-mode');
        this.refs.resultsPanel.classList.remove('active');
      },
      
      renderKPIs(data) {
        const metrics = AnalyseDesignerFramework.getState('metrics');
        const rowCount = data.length;
        
        let kpisHtml = `
          <div class="kpi-card">
            <div class="kpi-label">Datensätze</div>
            <div class="kpi-value">${rowCount.toLocaleString('de-CH')}</div>
          </div>
        `;
        
        metrics.forEach(metric => {
          const values = data.map(row => parseFloat(row[`${metric.table}.${metric.field}`]) || 0);
          let value = 0;
          
          switch (metric.aggregation) {
            case 'sum': value = values.reduce((a, b) => a + b, 0); break;
            case 'avg': value = values.reduce((a, b) => a + b, 0) / values.length; break;
            case 'min': value = Math.min(...values); break;
            case 'max': value = Math.max(...values); break;
            case 'count': value = values.length; break;
          }
          
          kpisHtml += `
            <div class="kpi-card">
              <div class="kpi-label">${metric.aggregation.toUpperCase()}: ${metric.field}</div>
              <div class="kpi-value">${value.toLocaleString('de-CH', { maximumFractionDigits: 0 })}</div>
            </div>
          `;
        });
        
        if (metrics.length === 0) {
          const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
          const numericFields = selectedFields.filter(f => f.type === 'number');
          if (numericFields.length > 0) {
            const firstNumField = numericFields[0];
            const values = data.map(row => row[`${firstNumField.table}.${firstNumField.field}`] || 0);
            const sumValue = values.reduce((a, b) => a + b, 0);
            const avgValue = rowCount > 0 ? sumValue / rowCount : 0;
            
            kpisHtml += `
              <div class="kpi-card">
                <div class="kpi-label">Summe ${firstNumField.field}</div>
                <div class="kpi-value">${sumValue.toLocaleString('de-CH', { maximumFractionDigits: 0 })}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Ø ${firstNumField.field}</div>
                <div class="kpi-value">${avgValue.toLocaleString('de-CH', { maximumFractionDigits: 0 })}</div>
              </div>
            `;
          }
        }
        
        this.refs.kpiGrid.innerHTML = kpisHtml;
      },
      
      renderResultsTable(data) {
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        
        this.refs.resultsTableWrapper.innerHTML = '<table id="resultsTable" class="display" style="width:100%"></table>';
        
        const columns = selectedFields.map(f => {
          const full = `${f.table}.${f.field}`;
          return {
            title: full,
            data: null,
            render: (data, type, row) => {
              const value = row ? row[full] : data;
              if (type === 'display' && value !== null && value !== undefined) {
                if (f.type === 'number') return new Intl.NumberFormat('de-CH').format(value);
                if (f.type === 'date') return new Date(value).toLocaleDateString('de-CH');
              }
              return value ?? '';
            }
          };
        });
        
        new DataTable('#resultsTable', {
          data: data,
          columns: columns,
          pageLength: 25,
          language: {
            search: 'Suchen:',
            lengthMenu: '_MENU_ Einträge',
            info: '_START_-_END_ von _TOTAL_',
            infoEmpty: '0 Einträge',
            infoFiltered: '(gefiltert)',
            paginate: { first: '«', last: '»', next: '›', previous: '‹' }
          }
        });
      },
      
      renderChart(data) {
        const xAxis = AnalyseDesignerFramework.getState('xAxis');
        const yAxis = AnalyseDesignerFramework.getState('yAxis');
        const chartType = AnalyseDesignerFramework.getState('chartType');
        
        if (!xAxis || !yAxis) return;
        
        const grouped = {};
        data.forEach(row => {
          const xValue = row[`${xAxis.table}.${xAxis.field}`] || row[xAxis.field];
          const yValue = parseFloat(row[`${yAxis.table}.${yAxis.field}`] || row[yAxis.field]) || 0;
          if (!grouped[xValue]) grouped[xValue] = { sum: 0, count: 0 };
          grouped[xValue].sum += yValue;
          grouped[xValue].count += 1;
        });
        
        const labels = Object.keys(grouped);
        const values = labels.map(label => grouped[label].sum);
        
        const resultsChart = AnalyseDesignerFramework.getState('resultsChart');
        if (resultsChart) resultsChart.destroy();
        
        const ctx = this.refs.resultsChart.getContext('2d');
        const newChart = new Chart(ctx, {
          type: chartType,
          data: {
            labels: labels,
            datasets: [{
              label: `${yAxis.table}.${yAxis.field}`,
              data: values,
              backgroundColor: 'rgba(37, 99, 235, 0.7)',
              borderColor: 'rgba(37, 99, 235, 1)',
              borderWidth: 2,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: {
                  color: '#0f172a',
                  font: { size: 14, weight: '600' }
                }
              },
              tooltip: {
                backgroundColor: 'rgba(255, 255, 255, 0.95)',
                titleColor: '#0f172a',
                bodyColor: '#0f172a',
                borderColor: '#e2e8f0',
                borderWidth: 1,
                padding: 12,
                displayColors: true,
                callbacks: {
                  label: (context) => `${context.dataset.label}: ${context.parsed.y.toLocaleString('de-CH')}`
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9' },
                ticks: {
                  color: '#64748b',
                  callback: (value) => value.toLocaleString('de-CH')
                }
              },
              x: {
                grid: { display: false },
                ticks: { color: '#64748b' }
              }
            }
          }
        });
        
        AnalyseDesignerFramework.setState('resultsChart', newChart);
      },
      
      exportToCSV() {
        const lastAnalysisData = AnalyseDesignerFramework.getState('lastAnalysisData');
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        
        if (!lastAnalysisData || lastAnalysisData.length === 0) {
          AnalyseDesignerFramework.showNotification('❌ Keine Daten zum Exportieren. Führe zuerst eine Analyse aus.', 'error');
          return;
        }
        
        try {
          const headers = selectedFields.map(f => `${f.table}.${f.field}`);
          let csv = headers.join(',') + '\n';
          
          lastAnalysisData.forEach(row => {
            const values = selectedFields.map(f => {
              const fullName = `${f.table}.${f.field}`;
              let value = row[fullName];
              
              if (value === null || value === undefined) return '';
              if (typeof value === 'string' && value.includes(',')) {
                return `"${value.replace(/"/g, '""')}"`;
              }
              return value;
            });
            csv += values.join(',') + '\n';
          });
          
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          const url = URL.createObjectURL(blob);
          
          link.setAttribute('href', url);
          link.setAttribute('download', `analyse_${new Date().toISOString().split('T')[0]}.csv`);
          link.style.visibility = 'hidden';
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          AnalyseDesignerFramework.showNotification('✅ CSV Export erfolgreich!', 'success');
          
        } catch (error) {
          console.error('CSV Export failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler beim CSV Export: ' + error.message, 'error');
        }
      },
      
      exportToExcel() {
        const lastAnalysisData = AnalyseDesignerFramework.getState('lastAnalysisData');
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        
        if (!lastAnalysisData || lastAnalysisData.length === 0) {
          AnalyseDesignerFramework.showNotification('❌ Keine Daten zum Exportieren. Führe zuerst eine Analyse aus.', 'error');
          return;
        }
        
        try {
          let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
          html += '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>';
          html += '<x:Name>Analyse</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>';
          html += '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>';
          html += '<table border="1">';
          
          html += '<thead><tr>';
          selectedFields.forEach(f => {
            html += `<th style="background-color: #2563eb; color: white; font-weight: bold; padding: 8px;">${f.table}.${f.field}</th>`;
          });
          html += '</tr></thead>';
          
          html += '<tbody>';
          lastAnalysisData.forEach(row => {
            html += '<tr>';
            selectedFields.forEach(f => {
              const fullName = `${f.table}.${f.field}`;
              let value = row[fullName];
              
              if (value === null || value === undefined) value = '';
              
              if (f.type === 'number') {
                html += `<td style="text-align: right; padding: 6px;">${new Intl.NumberFormat('de-CH').format(value)}</td>`;
              } else if (f.type === 'date') {
                html += `<td style="padding: 6px;">${new Date(value).toLocaleDateString('de-CH')}</td>`;
              } else {
                html += `<td style="padding: 6px;">${value}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</tbody></table></body></html>';
          
          const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
          const link = document.createElement('a');
          const url = URL.createObjectURL(blob);
          
          link.setAttribute('href', url);
          link.setAttribute('download', `analyse_${new Date().toISOString().split('T')[0]}.xls`);
          link.style.visibility = 'hidden';
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          AnalyseDesignerFramework.showNotification('✅ Excel Export erfolgreich!', 'success');
          
        } catch (error) {
          console.error('Excel Export failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler beim Excel Export: ' + error.message, 'error');
        }
      }
    });
