<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relational Analysis Tool</title>
  
  <!-- jQuery MUSS ZUERST kommen https://claude.ai/chat/20a462a3-fc46-48c5-919b-95b1dffe20cd -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://cdn.datatables.net/2.0.0/js/dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --primary-dark: #1e40af;
      --accent: #0891b2;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.08);
      --shadow-lg: rgba(15, 23, 42, 0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Header */
    .header {
      background: var(--surface);
      padding: 1.25rem 2rem;
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .header-left { display: flex; align-items: center; gap: 1rem; }

    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .header h1 { font-size: 1.375rem; font-weight: 700; color: var(--text); }
    .header-subtitle { font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.125rem; }
    .header-actions { display: flex; gap: 0.75rem; align-items: center; }

    .search-trigger {
      display: flex; align-items: center; gap: 0.625rem;
      padding: 0.625rem 1rem;
      background: var(--surface-hover);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .search-trigger:hover {
      border-color: var(--primary);
      background: var(--surface);
      color: var(--text);
    }

    .kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.125rem 0.375rem;
      font-size: 0.75rem;
      font-family: monospace;
      box-shadow: 0 1px 2px var(--shadow);
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    /* Search Modal */
    .search-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .search-modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .search-dialog {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 20px 60px var(--shadow-lg);
      width: 90%;
      max-width: 640px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      animation: slideDown 0.3s ease;
      border: 1px solid var(--border);
    }

    .search-input-wrapper {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .search-icon { font-size: 1.25rem; color: var(--text-muted); }
    .search-input {
      flex: 1; border: none; outline: none;
      font-size: 1rem; color: var(--text);
      background: transparent;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-results { overflow-y: auto; max-height: calc(70vh - 80px); }

    .search-category {
      padding: 0.75rem 1.5rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .search-item {
      padding: 0.875rem 1.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .search-item:hover, .search-item.selected {
      background: var(--surface-hover);
      border-left-color: var(--primary);
    }

    .search-item-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      flex-shrink: 0;
    }

    .search-item-content { flex: 1; min-width: 0; }
    .search-item-title {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--text);
      margin-bottom: 0.125rem;
    }
    .search-item-meta { font-size: 0.8125rem; color: var(--text-muted); }

    .search-badge {
      background: #eff6ff;
      color: var(--primary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      margin-left: 0.375rem;
    }

    .search-footer {
      padding: 0.75rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-hint { display: flex; align-items: center; gap: 0.375rem; }

    /* Main Layout */
    .container {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr) 400px;
      gap: 1.5rem;
      padding: 1.5rem;
      height: calc(100vh - 105px);
      overflow: hidden;
    }

    .container.results-mode {
      grid-template-columns: 1fr;
      padding: 2rem 4rem;
    }

.panel {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 3px var(--shadow);
      min-width: 0;
    }

    .panel-header {
      padding: 1.125rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
    }

    .panel-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .panel-body {
      padding: 1.5rem;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      min-height: 0;
    }

    .panel-body > div {
      max-width: 100%;
    }

    /* DataTable Container Fix */
    #dataTable_wrapper {
      max-width: 100%;
      overflow-x: auto;
    }

    #dataTable {
      max-width: 100% !important;
      table-layout: fixed;
    }

    #dataTable th,
    #dataTable td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }    

    /* Relationship Flow */
    .relationship-flow {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .flow-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .flow-chain { display: flex; flex-direction: column; gap: 0.75rem; }

    .flow-node {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.875rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }

    .flow-node.active {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .flow-node-icon {
      width: 32px; height: 32px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      flex-shrink: 0;
    }

    .flow-node-info { flex: 1; }
    .flow-node-name { font-weight: 600; font-size: 0.875rem; color: var(--text); }
    .flow-node-rel { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.125rem; }

    .flow-node-join {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .flow-node-join select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      color: var(--text);
    }

    .flow-connector {
      width: 2px;
      height: 16px;
      background: linear-gradient(to bottom, var(--border), var(--primary));
      margin: 0 auto;
      position: relative;
    }

    .flow-connector::after {
      content: '↓';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--primary);
      font-size: 0.875rem;
    }

    .table-list { display: flex; flex-direction: column; gap: 1rem; }

    .table-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .table-item:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
    }

    .table-item.active {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .table-header {
      padding: 1rem 1.125rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: var(--surface);
      transition: background 0.2s ease;
    }

    .table-item.active .table-header { background: #eff6ff; }
    .table-header:hover { background: var(--surface-hover); }

    .table-info { display: flex; align-items: center; gap: 0.75rem; }

    .table-icon {
      width: 32px; height: 32px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
    }

    .table-name { font-weight: 600; font-size: 0.9375rem; color: var(--text); }
    .table-count { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.125rem; }

    .table-expand-icon {
      color: var(--text-muted);
      font-size: 1.125rem;
      transition: transform 0.3s ease;
    }

    .table-item.expanded .table-expand-icon { transform: rotate(90deg); }

    .table-fields {
      padding: 0.5rem 0.75rem;
      display: none;
      background: #fafbfc;
      border-top: 1px solid var(--border);
    }

    .table-item.expanded .table-fields { display: block; }

    .field-item {
      padding: 0.625rem 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .field-item:hover { background: var(--surface); }

    .field-item.foreign-key {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
    }

    .field-item input[type="checkbox"] {
      width: 17px; height: 17px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .field-label { flex: 1; font-size: 0.875rem; color: var(--text); }
    .field-key-icon { font-size: 0.875rem; }

    .field-type {
      margin-left: auto;
      font-size: 0.6875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .field-type.text { background: #f1f5f9; color: #475569; }
    .field-type.number { background: #d1fae5; color: #065f46; }
    .field-type.date { background: #dbeafe; color: #1e40af; }

    .add-table-btn {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 2px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .add-table-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #eff6ff;
    }

    /* Context Menu */
    .context-menu {
      display: none;
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px var(--shadow-lg);
      z-index: 2000;
      min-width: 200px;
      padding: 0.5rem 0;
    }

    .context-menu.active { display: block; }

    .context-menu-item {
      padding: 0.625rem 1rem;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
    }

    .context-menu-item:hover { background: var(--surface-hover); }

    .context-menu-item input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--primary);
    }

    .context-menu-divider {
      height: 1px;
      background: var(--border);
      margin: 0.5rem 0;
    }

    /* DataTable */
    table.dataTable {
      width: 100% !important;
      max-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
      overflow-x: auto;
    }
    
    table.dataTable thead,
    table.dataTable tbody,
    table.dataTable tfoot {
      display: table;
      width: 100%;
      table-layout: auto;
    }

    table.dataTable thead th {
      background: #f8fafc;
      color: var(--text);
      padding: 1rem;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      cursor: move;
      user-select: none;
      position: relative;
      font-size: 0.8125rem;
    }

    table.dataTable thead th:hover { background: #eff6ff; }
    table.dataTable thead th.dragging { opacity: 0.5; cursor: grabbing; }

    table.dataTable tbody td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text);
      font-size: 0.875rem;
    }

    table.dataTable tbody tr:hover { background: #fafbfc; }

    table.dataTable tfoot th {
      background: #f8fafc;
      color: var(--text);
      padding: 0.875rem 1rem;
      font-weight: 600;
      border-top: 2px solid var(--border);
      font-size: 0.8125rem;
    }

    .drag-hint {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.2s;
    }

    table.dataTable thead th:hover .drag-hint { opacity: 1; }

    /* Configuration */
    .config-section { margin-bottom: 2rem; }

    .config-section-title {
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text);
    }

    .metric-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .metric-card {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1.5px solid var(--primary);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-name {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--primary-dark);
    }

    .metric-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.125rem;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .metric-remove:hover {
      background: rgba(220, 38, 38, 0.1);
      color: var(--danger);
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .metric-field {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .drop-zone {
      min-height: 120px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 0.2s ease;
      background: #fafbfc;
    }

    .drop-zone.drag-over {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .drop-zone.empty { align-items: center; justify-content: center; }
    .drop-zone-hint { color: var(--text-muted); font-size: 0.8125rem; text-align: center; }

    .filter-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      transition: all 0.2s ease;
    }

    .filter-item:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.1);
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-field { font-weight: 600; font-size: 0.875rem; color: var(--primary); }

    .filter-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .filter-remove:hover { background: #fee2e2; color: var(--danger); }

    .filter-controls {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-controls select, .filter-controls input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text);
      font-size: 0.875rem;
    }

    .filter-controls select:focus, .filter-controls input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .chart-config {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .axis-drop-zone {
      min-height: 80px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: #fafbfc;
    }

    .axis-drop-zone.drag-over {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .axis-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .axis-field {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* Results */
    .results-container { display: none; }
    .results-container.active { display: block; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .kpi-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .kpi-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;

<body>
  <!-- Root Container - wird komplett per JavaScript gerendert -->
  <div id="app"></div>

<script>
    // ============================================================================
    // ANALYSE DESIGNER FRAMEWORK
    // Modulares JavaScript Framework ohne jQuery
    // ============================================================================
    
    const AnalyseDesignerFramework = (function() {
      'use strict';

      // ============================================================================
      // PRIVATE STATE
      // ============================================================================
      
      const state = {
        schema: null,
        mockData: null,
        selectedFields: [],
        filters: [],
        metrics: [],
        xAxis: null,
        yAxis: null,
        chartType: 'bar',
        tableJoins: [],
        joinFieldByTable: {},
        columnAggregations: {},
        lastAnalysisData: null,
        dataTable: null,
        resultsChart: null,
        searchSelectedIndex: 0,
        currentContextColumn: null
      };

      const observers = [];
      const components = {};
      const mountedInstances = new Map();

      // ============================================================================
      // OBSERVER PATTERN - STATE MANAGEMENT
      // ============================================================================
      
      function notifyObservers(eventType, data) {
        observers.forEach(observer => {
          if (observer.eventType === eventType || observer.eventType === '*') {
            observer.callback(data);
          }
        });
      }

      function subscribe(eventType, callback) {
        observers.push({ eventType, callback });
        return () => {
          const index = observers.findIndex(o => o.callback === callback);
          if (index > -1) observers.splice(index, 1);
        };
      }

      // ============================================================================
      // STATE GETTERS & SETTERS
      // ============================================================================
      
      function getState(key) {
        return key ? state[key] : { ...state };
      }

      function setState(key, value) {
        const oldValue = state[key];
        state[key] = value;
        notifyObservers('stateChange', { key, value, oldValue });
        notifyObservers(`stateChange:${key}`, { value, oldValue });
      }

      function updateState(updates) {
        Object.keys(updates).forEach(key => {
          setState(key, updates[key]);
        });
      }

      // ============================================================================
      // UTILITY FUNCTIONS
      // ============================================================================
      
      function $(selector, context = document) {
        return context.querySelector(selector);
      }

      function $$(selector, context = document) {
        return Array.from(context.querySelectorAll(selector));
      }

      function createElement(html) {
        const temp = document.createElement('div');
        temp.innerHTML = html.trim();
        return temp.firstChild;
      }
      
      function emit(name, detail) {
        document.dispatchEvent(new CustomEvent(name, { detail }));
      }

      function showNotification(message, type = 'success') {
        const colors = {
          success: 'linear-gradient(135deg, #10b981, #059669)',
          error: 'linear-gradient(135deg, #ef4444, #dc2626)',
          info: 'linear-gradient(135deg, #3b82f6, #2563eb)',
          warning: 'linear-gradient(135deg, #f59e0b, #d97706)'
        };
        
        const notification = createElement(`
          <div style="position: fixed; top: 80px; right: 20px; background: ${colors[type]}; 
               color: white; padding: 1rem 1.5rem; border-radius: 10px; 
               box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); z-index: 9999; 
               font-weight: 600; animation: slideIn 0.3s ease;">
            ${message}
          </div>
        `);
        
        document.body.appendChild(notification);
        setTimeout(() => {
          notification.style.animation = 'slideOut 0.3s ease';
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }

      // ============================================================================
      // COMPONENT REGISTRY
      // ============================================================================
      
      function registerComponent(name, component) {
        if (components[name]) {
          console.warn(`Component "${name}" already registered. Overwriting...`);
        }
        components[name] = component;
        console.log(`✅ Component registered: ${name}`);
      }

function getComponent(name) {
        if (!components[name]) {
          throw new Error(`Component "${name}" not found`);
        }
        return components[name];
      }

      // ============================================================================
      // COMPONENT LIFECYCLE
      // ============================================================================
      
function createComponentInstance(name, container, options = {}) {
        const component = getComponent(name);
        
        const instance = {
          name,
          container,
          options,
          state: {},
          refs: {},
          mounted: false,
          
          render() {
            if (component.template) {
              if (typeof component.template === 'function') {
                container.innerHTML = component.template.call(this, this.state, options);
              } else {
                container.innerHTML = component.template;
              }
              this.findRefs();
            }
            
            if (component.afterRender) {
              component.afterRender.call(this);
            }
          },
          
          findRefs() {
            this.refs = {};
            const refElements = container.querySelectorAll('[data-ref]');
            refElements.forEach(el => {
              const refName = el.getAttribute('data-ref');
              this.refs[refName] = el;
            });
          },
          
          mount() {
            if (this.mounted) return;
            
            if (component.beforeMount) {
              component.beforeMount.call(this);
            }
            
            this.render();
            
            if (component.mounted) {
              component.mounted.call(this);
            }
            
            this.mounted = true;
          },
          
          unmount() {
            if (!this.mounted) return;
            
            if (component.beforeUnmount) {
              component.beforeUnmount.call(this);
            }
            
            container.innerHTML = '';
            this.refs = {};
            this.mounted = false;
            
            if (component.unmounted) {
              component.unmounted.call(this);
            }
          },
          
          update() {
            if (!this.mounted) return;
            this.render();
          }
        };
        
        // KRITISCH: Kopiere alle Custom-Methoden von der Komponente auf die Instanz
        Object.keys(component).forEach(key => {
          const value = component[key];
          // Nur Funktionen kopieren, keine Lifecycle-Hooks oder template
          if (typeof value === 'function' && 
              !['beforeMount', 'mounted', 'beforeUnmount', 'unmounted', 'afterRender', 'template'].includes(key)) {
            instance[key] = value.bind(instance);
          }
        });
        
        return instance;
      }

      // ============================================================================
      // UTILITY FUNCTIONS
      // ============================================================================

      // ============================================================================
      // MOUNT SYSTEM
      // ============================================================================
      
      function mount(componentName, containerSelector, options = {}) {
        const container = $(containerSelector);
        
        if (!container) {
          throw new Error(`Container "${containerSelector}" not found`);
        }
        
        // Unmount existing instance
        if (mountedInstances.has(containerSelector)) {
          const existing = mountedInstances.get(containerSelector);
          existing.unmount();
        }
        
        const instance = createComponentInstance(componentName, container, options);
        instance.mount();
        
        mountedInstances.set(containerSelector, instance);
        
        console.log(`✅ Mounted: ${componentName} → ${containerSelector}`);
        return instance;
      }

      function unmount(containerSelector) {
        if (mountedInstances.has(containerSelector)) {
          const instance = mountedInstances.get(containerSelector);
          instance.unmount();
          mountedInstances.delete(containerSelector);
          console.log(`🗑️ Unmounted: ${containerSelector}`);
        }
      }

      function bootstrap(config) {
        const { root, initialState } = config;
        
        // Set initial state
        if (initialState) {
          updateState(initialState);
        }
        
        // Render root component
        const rootContainer = $(root);
        if (!rootContainer) {
          throw new Error(`Root container "${root}" not found`);
        }
        
        // Mount App component
        mount('App', root);
        
        console.log('🎉 App bootstrapped!');
      }

      // ============================================================================
      // PUBLIC API
      // ============================================================================
      
      const API = {
        // State Management
        getState,
        setState,
        updateState,
        subscribe,
        
        // Component System
        registerComponent,
        getComponent,
        mount,
        unmount,
        bootstrap,
        
        // Utilities
        showNotification,
        $,
        $$,
        createElement,
        emit,
        
        version: '2.0.0',
        name: 'AnalyseDesignerFramework'
      };

      return API;
    })();

// ============================================================================
    // APP ROOT COMPONENT
    // ============================================================================
    
    AnalyseDesignerFramework.registerComponent('App', {
      template: `
        <header class="header">
          <div class="header-left">
            <div class="logo">📊</div>
            <div>
              <h1>Relational Analysis</h1>
              <div class="header-subtitle">Konfigurieren → Filtern → Gruppieren → Ergebnis</div>
            </div>
          </div>
          <div class="header-actions" data-ref="headerActions"></div>
        </header>
        
        <div class="container" data-ref="mainContainer">
          <div data-ref="dataModelPanel"></div>
          <div data-ref="previewPanel"></div>
          <div data-ref="configPanel"></div>
          <div data-ref="resultsPanel"></div>
        </div>
        
        <div data-ref="modalsContainer"></div>
      `,
      
      mounted() {
        // Mount child components
        AnalyseDesignerFramework.mount('HeaderActions', '[data-ref="headerActions"]');
        AnalyseDesignerFramework.mount('DataModelPanel', '[data-ref="dataModelPanel"]');
        AnalyseDesignerFramework.mount('PreviewPanel', '[data-ref="previewPanel"]');
        AnalyseDesignerFramework.mount('ConfigPanel', '[data-ref="configPanel"]');
        AnalyseDesignerFramework.mount('ResultsPanel', '[data-ref="resultsPanel"]');
        AnalyseDesignerFramework.mount('ModalsContainer', '[data-ref="modalsContainer"]');
        
        // Setup keyboard shortcuts
        this.setupKeyboardShortcuts();
      },
      
      setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            const searchModal = document.querySelector('[data-ref="searchModal"]');
            if (searchModal) searchModal.classList.add('active');
          }
          
          if ((e.metaKey || e.ctrlKey) && e.key === 's') {
            e.preventDefault();
            const saveModal = document.querySelector('[data-ref="presetSaveModal"]');
            if (saveModal) saveModal.classList.add('active');
          }
          
          if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
            e.preventDefault();
            const loadModal = document.querySelector('[data-ref="presetLoadModal"]');
            if (loadModal) loadModal.classList.add('active');
          }
          
          if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            e.preventDefault();
            const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
            if (selectedFields.length > 0) {
              AnalyseDesignerFramework.setState('triggerAnalysis', Date.now());
            } else {
              AnalyseDesignerFramework.showNotification('⚠️ Wähle zuerst Felder aus', 'warning');
            }
          }
          
          if (e.key === 'Escape') {
            document.querySelectorAll('.search-modal.active').forEach(modal => {
              modal.classList.remove('active');
            });
          }
        });
      }
    });

    // ============================================================================
    // DATA SCHEMA
    // ============================================================================
    
    const schema = {
      tables: [
        {
          name: 'Account',
          icon: '🏢',
          fields: [
            { name: 'Account_ID', type: 'number', key: true },
            { name: 'Name', type: 'text' },
            { name: 'Region', type: 'text' },
            { name: 'Industry', type: 'text' },
            { name: 'Annual_Revenue', type: 'number' }
          ],
          relationships: [
            { toTable: 'Contact', type: '1:n', via: 'Account_ID', description: 'Ein Account hat mehrere Kontakte' },
            { toTable: 'Opportunity', type: '1:n', via: 'Account_ID', description: 'Ein Account hat mehrere Opportunities' }
          ]
        },
        {
          name: 'Contact',
          icon: '👤',
          fields: [
            { name: 'Contact_ID', type: 'number', key: true },
            { name: 'Account_ID', type: 'number', foreign: true },
            { name: 'Name', type: 'text' },
            { name: 'Email', type: 'text' },
            { name: 'Phone', type: 'text' },
            { name: 'Title', type: 'text' }
          ],
          relationships: [

          ]
        },
        {
          name: 'Opportunity',
          icon: '💼',
          fields: [
            { name: 'Opportunity_ID', type: 'number', key: true },
            { name: 'Account_ID', type: 'number', foreign: true },
            { name: 'Name', type: 'text' },
            { name: 'Stage', type: 'text' },
            { name: 'Amount', type: 'number' },

            { name: 'CloseDate', type: 'date' }
          ],

          ]
        }
      ]
    };

// ============================================================================
    // HEADER ACTIONS COMPONENT
    // ============================================================================
    
    AnalyseDesignerFramework.registerComponent('HeaderActions', {
      template: `
        <div class="search-trigger" data-ref="searchTrigger">
          <span>🔍</span>
          <span>Tabelle suchen...</span>
          <span class="kbd">⌘K</span>
        </div>
        <button class="btn btn-secondary" data-ref="btnLoadDemo">🎲 Demo-Daten laden</button>
        <button class="btn btn-secondary" data-ref="btnLoadPreset">📂 Preset laden</button>
        <button class="btn btn-secondary" data-ref="btnSave">💾 Preset speichern</button>
        <button class="btn btn-primary" data-ref="btnAnalyze">▶ Analysieren</button>
      `,
      
      mounted() {
        this.refs.searchTrigger.addEventListener('click', () => {
          const searchModal = document.querySelector('[data-ref="searchModal"]');
          if (searchModal) searchModal.classList.add('active');
        });
        
        this.refs.btnLoadDemo.addEventListener('click', () => {
          this.loadDemo();
        });
        
        this.refs.btnLoadPreset.addEventListener('click', () => {
          const loadModal = document.querySelector('[data-ref="presetLoadModal"]');
          if (loadModal) loadModal.classList.add('active');
        });
        
        this.refs.btnSave.addEventListener('click', () => {
          const saveModal = document.querySelector('[data-ref="presetSaveModal"]');
          if (saveModal) saveModal.classList.add('active');
        });
        
        this.refs.btnAnalyze.addEventListener('click', () => {
          const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
          if (selectedFields.length === 0) {
            AnalyseDesignerFramework.showNotification('⚠️ Bitte wähle mindestens ein Feld aus!', 'warning');
            return;
          }
          AnalyseDesignerFramework.setState('triggerAnalysis', Date.now());
        });
      },
      
      loadDemo() {
        console.log('🎲 Loading demo data...');
        
        const schema = AnalyseDesignerFramework.getState('schema');
        
        AnalyseDesignerFramework.updateState({
          selectedFields: [],
          filters: [],
          metrics: []
        });
        
        const accountFields = schema.tables.find(t => t.name === 'Account').fields.filter(f => !f.foreign);
        const opportunityFields = schema.tables.find(t => t.name === 'Opportunity').fields.filter(f => !f.foreign);
        
        const selectedFields = [];
        [...accountFields, ...opportunityFields].forEach(field => {
          const tableName = accountFields.includes(field) ? 'Account' : 'Opportunity';
          selectedFields.push({ 
            table: tableName, 
            field: field.name, 
            type: field.type 
          });
        });
        
        const metrics = [{
          table: 'Opportunity',
          field: 'Amount',
          type: 'number',
          aggregation: 'sum'
        }];
        
        const xAxis = { table: 'Account', field: 'Region', type: 'text' };
        const yAxis = { table: 'Opportunity', field: 'Amount', type: 'number' };
        
        AnalyseDesignerFramework.updateState({
          selectedFields,
          metrics,
          xAxis,
          yAxis
        });
        
        AnalyseDesignerFramework.showNotification('✅ Demo-Daten geladen! Bereit zur Analyse (20 Accounts, 35 Opportunities)', 'success');
      }
    });

    // API Endpoints Configuration
  const API_ENDPOINTS = {
    artifacts: '/mod_linkedinapp/php/analysis/artifacts.php',
    artifactGet: '/mod_linkedinapp/php/analysis/artifact_get.php',
    artifactSave: '/mod_linkedinapp/php/analysis/artifact_save.php',
    data: '/mod_linkedinapp/php/analysis/data.php',
    export: '/mod_linkedinapp/php/analysis/export.php',
    presets: '/mod_linkedinapp/php/analysis/presets.php',
    
    // NEU: Join-Logik vom Server
    getTableRelations: '/mod_linkedinapp/php/analysis/get_table_relations.php',
    getJoinDefinition: '/mod_linkedinapp/php/analysis/get_join_definition.php',
    executeAnalysis: '/mod_linkedinapp/php/analysis/execute_analysis.php'
  };

  // API Helper for future backend calls (currently unused)
  const APIHelper = {
    async call(endpoint, options = {}) {
      if (location.protocol === 'file:') {
        AnalyseDesignerFramework.showNotification('Fehler bei der Analyse: Datei-Modus (file://) – CORS blockiert Serveraufrufe. Öffne die Seite via http(s) oder nutze Demo-Daten.', 'error');
        // Im Datei-Modus niemals einen Fehler werfen – friedlich zurückgeben, damit nichts crasht
        return { _fileMode: true };
      }
      const response = await fetch(endpoint, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...options.headers
        }
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      
      return await response.json();
    }
  };

      `,

    // ============================================================================
    // SEARCH MODAL COMPONENT
    // ============================================================================
    
    AnalyseDesignerFramework.registerComponent('SearchModal', {
      template: `
        <div class="search-modal" data-ref="modal">
          <div class="search-dialog">
            <div class="search-input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" class="search-input" data-ref="searchInput" placeholder="Tabelle oder Feld suchen..." autocomplete="off">
            </div>
            <div class="search-results" data-ref="searchResults"></div>
            <div class="search-footer">
              <span class="search-hint"><span class="kbd">⌘K</span> Suche</span>
              <span class="search-hint"><span class="kbd">⌘S</span> Speichern</span>
              <span class="search-hint"><span class="kbd">⌘O</span> Laden</span>
              <span class="search-hint"><span class="kbd">⌘↵</span> Analysieren</span>
              <span class="search-hint"><span class="kbd">↵</span> Auswählen</span>
              <span class="search-hint"><span class="kbd">ESC</span> Schließen</span>
            </div>
          </div>
        </div>
      `,
      
      mounted() {
        this.refs.modal.addEventListener('click', (e) => {
          if (e.target === this.refs.modal) {
            this.refs.modal.classList.remove('active');
          }
        });
        
        this.refs.searchInput.addEventListener('input', (e) => {
          this.performSearch(e.target.value);
        });
        
        this.refs.searchInput.addEventListener('keydown', (e) => {
          const items = this.refs.searchResults.querySelectorAll('.search-item');
          let searchSelectedIndex = AnalyseDesignerFramework.getState('searchSelectedIndex') || 0;
          
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            searchSelectedIndex = Math.min(searchSelectedIndex + 1, items.length - 1);
            AnalyseDesignerFramework.setState('searchSelectedIndex', searchSelectedIndex);
            this.updateSearchSelection();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            searchSelectedIndex = Math.max(searchSelectedIndex - 1, 0);
            AnalyseDesignerFramework.setState('searchSelectedIndex', searchSelectedIndex);
            this.updateSearchSelection();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (items[searchSelectedIndex]) items[searchSelectedIndex].click();
          } else if (e.key === 'Escape') {
            this.refs.modal.classList.remove('active');
          }
        });
      },
      
      performSearch(query) {
        const schema = AnalyseDesignerFramework.getState('schema');
        query = query.toLowerCase().trim();
        let html = '';
        
        const tableMatches = schema.tables.filter(t => t.name.toLowerCase().includes(query));
        
        if (tableMatches.length > 0 || query === '') {
          html += '<div class="search-category">Tabellen</div>';
          (query === '' ? schema.tables : tableMatches).forEach(table => {
            html += `
              <div class="search-item" data-action="expand-table" data-table="${table.name}">
                <div class="search-item-icon">${table.icon}</div>
                <div class="search-item-content">
                  <div class="search-item-title">${table.name}</div>
                  <div class="search-item-meta">${table.fields.length} Felder • ${table.relationships.length} Beziehungen</div>
                </div>
              </div>
            `;
          });
        }
        
        if (query !== '') {
          const fieldMatches = [];
          schema.tables.forEach(table => {
            table.fields.forEach(field => {
              if (field.name.toLowerCase().includes(query)) {
                fieldMatches.push({ table, field });
              }
            });
          });
          
          if (fieldMatches.length > 0) {
            html += '<div class="search-category">Felder</div>';
            fieldMatches.forEach(({ table, field }) => {
              html += `
                <div class="search-item" data-action="select-field" data-table="${table.name}" data-field="${field.name}">
                  <div class="search-item-icon">${table.icon}</div>
                  <div class="search-item-content">
                    <div class="search-item-title">${field.name} ${field.key ? '🔑' : ''}<span class="search-badge">${field.type}</span></div>
                    <div class="search-item-meta">${table.name}</div>
                  </div>
                </div>
              `;
            });
          }
        }
        
        this.refs.searchResults.innerHTML = html || '<div style="padding: 2rem; text-align: center; color: var(--text-muted);">Keine Ergebnisse gefunden</div>';
        this.refs.searchResults.querySelectorAll('.search-item').forEach(item => {
          item.addEventListener('click', () => this.handleSearchSelect(item));
        });
        this.updateSearchSelection();
      },
      
      updateSearchSelection() {
        const items = this.refs.searchResults.querySelectorAll('.search-item');
        const searchSelectedIndex = AnalyseDesignerFramework.getState('searchSelectedIndex') || 0;
        
        items.forEach((item, index) => {
          if (index === searchSelectedIndex) {
            item.classList.add('selected');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('selected');
          }
        });
      },
      
      handleSearchSelect(item) {
        const action = item.dataset.action;
        const tableName = item.dataset.table;
        
        this.refs.modal.classList.remove('active');
        this.refs.searchInput.value = '';
        
        if (action === 'expand-table') {
          setTimeout(() => {
            const tableItem = document.querySelector(`[data-table-name="${tableName}"]`);
            if (tableItem) {
              tableItem.classList.add('expanded', 'active');
              const arrow = tableItem.querySelector('.table-expand-icon');
              if (arrow) arrow.style.transform = 'rotate(90deg)';
              tableItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        } else if (action === 'select-field') {
          const fieldName = item.dataset.field;
          setTimeout(() => {
            const tableItem = document.querySelector(`[data-table-name="${tableName}"]`);
            if (tableItem) {
              tableItem.classList.add('expanded', 'active');
              const arrow = tableItem.querySelector('.table-expand-icon');
              if (arrow) arrow.style.transform = 'rotate(90deg)';
              const checkbox = document.querySelector(`#field_${tableName}_${fieldName}`);
              if (checkbox && !checkbox.checked) {
                checkbox.checked = true;
                checkbox.dispatchEvent(new Event('change'));
              }
              tableItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        }
      }
    });

      mounted() {

          this.refs.modal.classList.remove('active');
        });
        
        this.refs.cancelBtn.addEventListener('click', () => {
          this.refs.modal.classList.remove('active');
        });
        
        this.refs.saveBtn.addEventListener('click', () => {
          this.savePreset();
        });
        
        this.refs.nameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.savePreset();
        });
      },
      
      savePreset() {
        const name = this.refs.nameInput.value.trim();
        const description = this.refs.descInput.value.trim();
        
        if (!name) {
          AnalyseDesignerFramework.showNotification('❌ Bitte gib einen Namen ein', 'error');
          this.refs.nameInput.focus();
          return;
        }
        
        try {
          const preset = {
            id: Date.now(),
            name: name,
            description: description,
            created: new Date().toISOString(),
            config: {
              tables: [...new Set(AnalyseDesignerFramework.getState('selectedFields').map(f => f.table))],
              fields: AnalyseDesignerFramework.getState('selectedFields'),
              filters: AnalyseDesignerFramework.getState('filters'),
              metrics: AnalyseDesignerFramework.getState('metrics'),
              joins: AnalyseDesignerFramework.getState('tableJoins'),
              joinFieldByTable: AnalyseDesignerFramework.getState('joinFieldByTable'),
              chartConfig: { 
                type: AnalyseDesignerFramework.getState('chartType'), 
                xAxis: AnalyseDesignerFramework.getState('xAxis'), 
                yAxis: AnalyseDesignerFramework.getState('yAxis') 
              },
              columnAggregations: AnalyseDesignerFramework.getState('columnAggregations')
            }
          };
          
          const presets = JSON.parse(localStorage.getItem('analysisPresets') || '[]');
          presets.push(preset);
          localStorage.setItem('analysisPresets', JSON.stringify(presets));
          
          this.refs.modal.classList.remove('active');
          this.refs.nameInput.value = '';
          this.refs.descInput.value = '';
          
          AnalyseDesignerFramework.showNotification(`✅ Preset "${name}" gespeichert!`, 'success');
          
        } catch (error) {
          console.error('Save failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler beim Speichern: ' + error.message, 'error');
        }
      }
    });

    AnalyseDesignerFramework.registerComponent('PresetLoadModal', {
      template: `
        <div class="search-modal" data-ref="modal">
          <div class="search-dialog" style="max-width: 600px;">
            <div class="search-input-wrapper" style="border-bottom: 1px solid var(--border);">
              <h3 style="margin: 0; font-size: 1.125rem; font-weight: 700;">📂 Preset laden</h3>
              <button data-ref="closeBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted);">×</button>
            </div>
            <div class="search-results" data-ref="presetList" style="max-height: 400px;"></div>
            <div class="search-footer">
              <span style="color: var(--text-muted); font-size: 0.8125rem;">Tipp: Verwende ↑ ↓ zum Navigieren, Enter zum Laden</span>
            </div>
          </div>
        </div>
      `,
      
      mounted() {
        this.refs.closeBtn.addEventListener('click', () => {
          this.refs.modal.classList.remove('active');
        });
        
        // Render presets when modal opens
        const observer = new MutationObserver(() => {
          if (this.refs.modal.classList.contains('active')) {
            this.renderPresets();
          }
        });
        observer.observe(this.refs.modal, { attributes: true, attributeFilter: ['class'] });
      },
      
      renderPresets() {
        const presets = JSON.parse(localStorage.getItem('analysisPresets') || '[]');
        
        if (presets.length === 0) {
          this.refs.presetList.innerHTML = `
            <div class="preset-empty">
              <div class="preset-empty-icon">📦</div>
              <p style="margin: 0; font-size: 0.9375rem;">Keine gespeicherten Presets gefunden</p>
              <p style="margin-top: 0.5rem; font-size: 0.8125rem;">Erstelle dein erstes Preset mit "💾 Preset speichern"</p>
            </div>
          `;
          return;
        }
        
        const sortedPresets = [...presets].sort((a, b) => new Date(b.created) - new Date(a.created));
        
        this.refs.presetList.innerHTML = sortedPresets.map((preset) => `
          <div class="preset-item" data-preset-id="${preset.id}">
            <div class="preset-item-header">
              <div style="flex: 1;">
                <div class="preset-item-title">${preset.name}</div>
                <div class="preset-item-meta">
                  Erstellt: ${new Date(preset.created).toLocaleDateString('de-CH', { 
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                  })}
                  ${preset.description ? ` • ${preset.description}` : ''}
                </div>
                <div class="preset-item-meta" style="margin-top: 0.25rem;">
                  ${preset.config.fields.length} Felder • ${preset.config.filters.length} Filter • ${preset.config.metrics.length} Metriken
                </div>
              </div>
              <div class="preset-item-actions">
                <button class="preset-action-btn delete" data-preset-id="${preset.id}" title="Löschen">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `).join('');
        
        // Bind click handlers
        this.refs.presetList.querySelectorAll('.preset-item').forEach(item => {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.preset-action-btn')) return;
            const presetId = parseInt(item.dataset.presetId);
            const preset = presets.find(p => p.id === presetId);
            if (preset) {
              this.loadPreset(preset);
              this.refs.modal.classList.remove('active');
            }
          });
        });
        
        // Bind delete handlers
        this.refs.presetList.querySelectorAll('.preset-action-btn.delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const presetId = parseInt(btn.dataset.presetId);
            this.deletePreset(presetId);
          });
        });
      },
      
      loadPreset(preset) {
        console.log('📂 Loading preset:', preset);
        
        try {
          const config = preset.config;
          
          AnalyseDesignerFramework.updateState({
            selectedFields: [],
            filters: [],
            metrics: [],
            xAxis: null,
            yAxis: null,
            joinFieldByTable: {},
            columnAggregations: {},
            tableJoins: []
          });
          
          config.fields.forEach(field => {
            AnalyseDesignerFramework.getState('selectedFields').push({ ...field });
          });
          
          AnalyseDesignerFramework.updateState({
            filters: config.filters ? [...config.filters] : [],
            metrics: config.metrics ? [...config.metrics] : [],
            tableJoins: config.joins ? [...config.joins] : [],
            joinFieldByTable: config.joinFieldByTable ? { ...config.joinFieldByTable } : {}
          });
          
          if (config.chartConfig) {
            AnalyseDesignerFramework.updateState({
              chartType: config.chartConfig.type || 'bar',
              xAxis: config.chartConfig.xAxis,
              yAxis: config.chartConfig.yAxis
            });
          }
          
          AnalyseDesignerFramework.setState('columnAggregations', config.columnAggregations ? { ...config.columnAggregations } : {});
          
          setTimeout(() => {
            document.querySelectorAll('.table-item').forEach(item => {
              const tableName = item.dataset.tableName;
              const hasFields = AnalyseDesignerFramework.getState('selectedFields').some(f => f.table === tableName);
              
              if (hasFields) {
                item.classList.add('active', 'expanded');
                const arrow = item.querySelector('.table-expand-icon');
                if (arrow) arrow.style.transform = 'rotate(90deg)';
              } else {
                item.classList.remove('active', 'expanded');
                const arrow = item.querySelector('.table-expand-icon');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
              }
            });
            
            document.querySelectorAll('input[type="checkbox"][data-table]').forEach(cb => {
              const table = cb.getAttribute('data-table');
              const field = cb.getAttribute('data-field');
              cb.checked = AnalyseDesignerFramework.getState('selectedFields').some(f => f.table === table && f.field === field);
            });
            
            const joinFieldByTable = AnalyseDesignerFramework.getState('joinFieldByTable');
            Object.keys(joinFieldByTable).forEach(table => {
              const field = joinFieldByTable[table];
              const btn = document.querySelector(`.link-toggle[data-table="${table}"][data-field="${field}"]`);
              if (btn) btn.classList.add('active');
            });
          }, 100);
          
          AnalyseDesignerFramework.setState('selectedFields', AnalyseDesignerFramework.getState('selectedFields'));
          
          AnalyseDesignerFramework.showNotification(`✅ Preset "${preset.name}" geladen!`, 'info');
          
        } catch (error) {
          console.error('Load preset failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler beim Laden des Presets: ' + error.message, 'error');
        }
      },
      
      deletePreset(presetId) {
        if (!confirm('Möchtest du dieses Preset wirklich löschen?')) return;
        
        try {
          let presets = JSON.parse(localStorage.getItem('analysisPresets') || '[]');
          presets = presets.filter(p => p.id !== presetId);
          localStorage.setItem('analysisPresets', JSON.stringify(presets));
          
          AnalyseDesignerFramework.showNotification('✅ Preset gelöscht', 'success');
          this.renderPresets();
          
        } catch (error) {
          console.error('Delete failed:', error);
          AnalyseDesignerFramework.showNotification('❌ Fehler beim Löschen', 'error');
        }
      }
    });

    AnalyseDesignerFramework.registerComponent('DataModelPanel', {
      template: `
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">📋 Datenmodell</div>
              <div class="panel-subtitle">Tabellen & Beziehungen</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="relationship-flow">
              <div class="flow-title"><i class="bi bi-share"></i><span> Aktive Beziehungen</span></div>
              <div class="flow-chain" data-ref="flowChain"></div>
            </div>
            <div class="table-list" data-ref="tableList"></div>
            <button class="add-table-btn" data-ref="addTableBtn">+ Weitere Tabelle hinzufügen</button>
          </div>
        </div>
      `,
      
      afterRender() {
        // Methoden sind jetzt auf der Komponenten-Definition, nicht auf der Instanz
      },
      
      mounted() {
        this.renderTableList();
        this.renderRelationshipFlow();
        
        this.refs.addTableBtn.addEventListener('click', () => {
          AnalyseDesignerFramework.showNotification('ℹ️ Alle verfügbaren Tabellen sind bereits angezeigt', 'info');
        });
        
        AnalyseDesignerFramework.subscribe('stateChange:selectedFields', () => {
          this.renderTableList();
          this.renderRelationshipFlow();
        });
        
        AnalyseDesignerFramework.subscribe('stateChange:joinFieldByTable', () => {
          this.renderRelationshipFlow();
        });
        
        AnalyseDesignerFramework.subscribe('stateChange:mainTable', () => {
          this.renderTableList();
          this.renderRelationshipFlow();
        });
      },
      
      renderTableList() {
        const schema = AnalyseDesignerFramework.getState('schema');
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        const mainTable = AnalyseDesignerFramework.getState('mainTable');
        const activeTables = [...new Set(selectedFields.map(f => f.table))];
        
        this.refs.tableList.innerHTML = '';
        
        schema.tables.forEach(table => {
          const tableItem = AnalyseDesignerFramework.createElement(`
            <div class="table-item" data-table-name="${table.name}">
              <div class="table-header">
                <div class="table-info">
                  <div class="table-icon">${table.icon}</div>
                  <span class="main-table-star" 
                        data-table="${table.name}"
                        title="Als Haupttabelle markieren"
                        style="cursor: pointer; font-size: 1.2rem; margin-right: 0.5rem;">
                    ${mainTable === table.name ? '⭐' : '☆'}
                  </span>
                  <div>
                    <div class="table-name">${table.name}</div>
                    <div class="table-count">${table.fields.length} Felder</div>
                  </div>
                </div>
                <span class="table-expand-icon">›</span>
              </div>
              <div class="table-fields">
                ${table.fields.map(field => `
                  <div class="field-item ${field.foreign ? 'foreign-key' : ''}">
                    <input type="checkbox" 
                           data-table="${table.name}" 
                           data-field="${field.name}"
                           data-type="${field.type}"
                           id="field_${table.name}_${field.name}"
                           ${selectedFields.some(f => f.table === table.name && f.field === field.name) ? 'checked' : ''}>
                    <label for="field_${table.name}_${field.name}" class="field-label">
                      ${field.name} 
                      ${field.key ? '<span class="field-key-icon">🔑</span>' : ''} 
                      ${field.foreign ? '<span class="field-key-icon"><i class="bi bi-share"></i></span>' : ''}
                    </label>
                    <span class="field-type ${field.type}">${field.type}</span>
                    ${table.name !== mainTable ? `
                      <span class="link-toggle"
                            title="Als Join-Feld verwenden"
                            style="display: ${table.name === mainTable ? 'none' : 'inline-block'};"
                            data-table="${table.name}"
                            data-field="${field.name}">
                        <i class="bi bi-share"></i>
                      </span>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `);
          
          this.refs.tableList.appendChild(tableItem);
          
          const header = tableItem.querySelector('.table-header');
          header.addEventListener('click', () => {
            tableItem.classList.toggle('expanded');
            const arrow = tableItem.querySelector('.table-expand-icon');
            arrow.style.transform = tableItem.classList.contains('expanded') ? 'rotate(90deg)' : 'rotate(0deg)';
          });
          // DnD: Header von der Vorschau zurück auf die Tabelle ziehen → Spalte entfernen
          header.addEventListener('dragover', (e) => { e.preventDefault(); header.classList.add('drag-over'); });
          header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
          header.addEventListener('drop', (e) => {
            e.preventDefault();
            header.classList.remove('drag-over');
            const payload = e.dataTransfer.getData('application/json');
            if (!payload || payload === 'undefined') return;
            let field;
            try { field = JSON.parse(payload); } catch { return; }
            if (!field || !field.table || !field.field) return;
            // nur Spalten dieser Tabelle entfernen
            if (field.table === table.name) {
              this.removeColumn(field);
            }
          });

          
          const star = tableItem.querySelector('.main-table-star');
          star.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // SERVER CALL: Hole mögliche Relations für diese Tabelle
            try {
              if (location.protocol === 'file:') {
                AnalyseDesignerFramework.showNotification('Fehler bei der Analyse: Datei-Modus (file://) – CORS blockiert Serveraufrufe. Öffne die Seite via http(s) oder nutze Demo-Daten.', 'error');
                return;
              }
              const response = await fetch(API_ENDPOINTS.getTableRelations, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableName: table.name })
              });
              
              const relations = await response.json();
              // relations = [ { toTable: 'Opportunity', joinKey: 'Account_ID', relationType: '1:n' }, ... ]
              
              AnalyseDesignerFramework.setState('mainTable', table.name);
              AnalyseDesignerFramework.setState('availableRelations', relations);
              
              const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
              table.fields.filter(f => !f.foreign).forEach(field => {
                if (!selectedFields.find(sf => sf.table === table.name && sf.field === field.name)) {
                  selectedFields.push({ table: table.name, field: field.name, type: field.type });
                }
              });
              AnalyseDesignerFramework.setState('selectedFields', selectedFields);
              
            } catch (error) {
              console.error('Failed to fetch table relations:', error);
              AnalyseDesignerFramework.showNotification('❌ Fehler beim Laden der Relationen', 'error');
            }
          });
          
          tableItem.querySelectorAll('.link-toggle').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const targetTable = btn.getAttribute('data-table');
              const field = btn.getAttribute('data-field');
              const mainTable = AnalyseDesignerFramework.getState('mainTable');
              
              // SERVER CALL: Hole Join-Definition
              try {
                if (location.protocol === 'file:') {
                  AnalyseDesignerFramework.showNotification('Fehler bei der Analyse: Datei-Modus (file://) – CORS blockiert Serveraufrufe. Öffne die Seite via http(s) oder nutze Demo-Daten.', 'error');
                  return;
                }
                const response = await fetch(API_ENDPOINTS.getJoinDefinition, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ 
                    fromTable: mainTable,
                    toTable: targetTable,
                    suggestedField: field
                  })
                });
                
                const joinDef = await response.json();
                // joinDef = { fromKey: 'Account_ID', toKey: 'Account_ID', valid: true }
                
                if (!joinDef.valid) {
                  AnalyseDesignerFramework.showNotification('⚠️ Ungültiger Join-Schlüssel', 'warning');
                  return;
                }
                
                const joinFieldByTable = AnalyseDesignerFramework.getState('joinFieldByTable');
                
                tableItem.querySelectorAll('.link-toggle').forEach(x => {
                  if (x.getAttribute('data-table') === targetTable) x.classList.remove('active');
                });
                
                if (joinFieldByTable[targetTable] === field) {
                  delete joinFieldByTable[targetTable];
                } else {
                  joinFieldByTable[targetTable] = field;
                  btn.classList.add('active');
                }
                
                AnalyseDesignerFramework.setState('joinFieldByTable', joinFieldByTable);
                
              } catch (error) {
                console.error('Failed to validate join:', error);
                AnalyseDesignerFramework.showNotification('❌ Fehler beim Validieren des Joins', 'error');
              }
            });
          });
          
          tableItem.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', (e) => {
              const table = e.target.getAttribute('data-table');
              const field = e.target.getAttribute('data-field');
              const type = e.target.getAttribute('data-type');
              const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
              
              if (e.target.checked) {
                if (!selectedFields.find(f => f.table === table && f.field === field)) {
                  selectedFields.push({ table, field, type });
                }
                tableItem.classList.add('active');
              } else {
                const i = selectedFields.findIndex(f => f.table === table && f.field === field);
                if (i > -1) selectedFields.splice(i, 1);
                if (!selectedFields.some(f => f.table === table)) {
                  tableItem.classList.remove('active');
                }
              }
              
              AnalyseDesignerFramework.setState('selectedFields', selectedFields);
            });
          });
        });
        
        const firstTable = this.refs.tableList.querySelector('.table-item');
        if (firstTable) {
          firstTable.classList.add('expanded');
          const arrow = firstTable.querySelector('.table-expand-icon');
          if (arrow) arrow.style.transform = 'rotate(90deg)';
        }
      },
      
      renderRelationshipFlow() {
        const selectedFields = AnalyseDesignerFramework.getState('selectedFields');
        const schema = AnalyseDesignerFramework.getState('schema');
        const joinFieldByTable = AnalyseDesignerFramework.getState('joinFieldByTable');
        const mainTable = AnalyseDesignerFramework.getState('mainTable');
        
        let activeTables = [];
        
        if (mainTable) {
          activeTables.push(mainTable);
          Object.keys(joinFieldByTable).forEach(table => {
            if (table !== mainTable && !activeTables.includes(table)) {
              activeTables.push(table);
            }
          });
        }
        
        if (activeTables.length === 0) {
          activeTables = [...new Set(selectedFields.map(f => f.table))];
        }
        
        if (mainTable && !activeTables.includes(mainTable)) {
          activeTables.unshift(mainTable);
        } else if (mainTable && activeTables.includes(mainTable)) {
          activeTables = activeTables.filter(t => t !== mainTable);
          activeTables.unshift(mainTable);
        }
        
        if (activeTables.length === 0) {
          this.refs.flowChain.innerHTML = `
            <div style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.875rem;">
              Wähle Felder aus mehreren Tabellen aus, um Beziehungen zu sehen
            </div>
          `;
          return;
        }
        
        if (activeTables.length === 1) {
          const table = schema.tables.find(t => t.name === activeTables[0]);
          this.refs.flowChain.innerHTML = `
            <div class="flow-node active">
              <div class="flow-node-icon">${table.icon}</div>
              <div class="flow-node-info">
                <div class="flow-node-name">${table.name}</div>
                <div class="flow-node-rel">Einzeltabelle (kein Join notwendig)</div>
              </div>
            </div>
          `;
          return;
        }
        
        const tableJoins = [];
        let html = '';
        
        activeTables.forEach((tableName, index) => {
          const table = schema.tables.find(t => t.name === tableName);
          const rel = table.relationships.find(r => activeTables.includes(r.toTable));
          
          if (index > 0 && rel) {
            const prevTable = activeTables[index - 1];
            tableJoins.push({
              fromTable: prevTable,
              toTable: tableName,
              via: joinFieldByTable[tableName] || rel.via
            });
          }
          
          html += `
            <div class="flow-node active">
              <div class="flow-node-icon">${table.icon}</div>
              <div class="flow-node-info">
                <div class="flow-node-name">${table.name}</div>
                <div class="flow-node-rel">${index === 0 ? 'Basis-Tabelle' : rel ? rel.description : ''}</div>
                ${index > 0 && rel ? `
                  <div class="flow-node-join">
                    <span>Join über:</span>
                    <select data-join-index="${index - 1}">
                      ${table.fields.filter(f => f.type === 'number').map(f => `
                        <option value="${f.name}" ${f.name === rel.via ? 'selected' : ''}>${f.name}</option>
                      `).join('')}
                    </select>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          
          if (index < activeTables.length - 1) html += '<div class="flow-connector"></div>';
        });
        
        this.refs.flowChain.innerHTML = html;
        AnalyseDesignerFramework.setState('tableJoins', tableJoins);
        
        this.refs.flowChain.querySelectorAll('select[data-join-index]').forEach(select => {
          select.addEventListener('change', (e) => {
            const joinIndex = parseInt(e.target.dataset.joinIndex);
            const tableJoins = AnalyseDesignerFramework.getState('tableJoins');
            if (tableJoins[joinIndex]) {
              tableJoins[joinIndex].via = e.target.value;
              AnalyseDesignerFramework.setState('tableJoins', tableJoins);
            }
          });
        });

        // Toggle „Erweitert“ (Select ein-/ausblenden)
        this.refs.flowChain.querySelectorAll('.toggle-join-adv').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const idx = link.dataset.index;
            const box = this.refs.flowChain.querySelector(`.join-adv[data-join-adv="${idx}"]`);
            if (!box) return;
            const open = (box.style.display === 'none' || !box.style.display);
            box.style.display = open ? '' : 'none';
            link.textContent = open ? 'Erweitert ▴' : 'Erweitert ▾';
          });
        });

        // Auto-Join über Endpoint
        this.refs.flowChain.querySelectorAll('.auto-join-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
              if (location.protocol === 'file:') {
                AnalyseDesignerFramework.showNotification('Fehler bei der Analyse: Datei-Modus (file://) – CORS blockiert Serveraufrufe. Öffne die Seite via http(s) oder nutze Demo-Daten.', 'error');
                return;
              }
              const idx = parseInt(btn.dataset.index);
              const fromTable = btn.dataset.from;
              const toTable = btn.dataset.to;
              const res = await fetch(API_ENDPOINTS.getJoinDefinition, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromTable, toTable })
              });
              const data = await res.json();
              const tableJoins = AnalyseDesignerFramework.getState('tableJoins');
              if (data?.via && tableJoins[idx]) {
                tableJoins[idx].via = data.via;
                AnalyseDesignerFramework.setState('tableJoins', tableJoins);
                const sel = this.refs.flowChain.querySelector(`select[data-join-index="${idx}"]`);
                if (sel) sel.value = data.via;
                AnalyseDesignerFramework.showNotification('🔗 Beziehung automatisch ermittelt: ' + data.via, 'success');
              } else {
                AnalyseDesignerFramework.showNotification('ℹ️ Keine passende Beziehung gefunden.', 'info');
              }
            } catch (err) {
              AnalyseDesignerFramework.showNotification('❌ Auto-Join fehlgeschlagen: ' + (err?.message || err), 'error');
            }
          });
        });
      }
    });
